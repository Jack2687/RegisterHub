    <script>
      (function () {
        try {
          var t = localStorage.getItem('ar_studio_theme') || 'dark';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var doc = document.documentElement;
          if (dark) doc.classList.add('dark');
          doc.style.colorScheme = dark ? 'dark' : 'light';
          var pal = localStorage.getItem('ar_studio_palette') || 'graphite';
          var rawPrefs = localStorage.getItem('ar_studio_prefs_v1');
          if (rawPrefs) {
            var p = JSON.parse(rawPrefs);
            if (p && (p.density === 'compact' || p.density === 'comfortable')) {
              doc.dataset.density = p.density;
            }
            if (p && typeof p.palette === 'string' && p.palette) {
              pal = p.palette;
            }
          }
          if (pal === 'gruvbox') pal = 'sakura';
          doc.dataset.palette = pal;
        } catch (e) {}
      })();
    </script>
